# FluxConfig System example configuration variables
FC_TAG=<TAG of FluxConfig images>

FC_CLIENT_PORT=<EXPOSED PORT FOR FluxConfig.WebClient>
STORAGE_API_PORT=<EXPOSED PORT FOR FluxConfig.Storage>
MANAGEMENT_API_PORT=<EXPOSED PORT FOR FluxConfig.Management>

EXTERNAL_CERT_PATH=<path to .pfx file from build dir>   # e.g ~/dev-certs/https/cert.pfx
INTERNAL_CERT_PATH=/https/certs/<path to .pfx from mounted dir> # e.g /https/certs/cert.pfx
CERT_PSWD=<PASSWORD FOR YOUR .pfx cert>

FCM_SYSADMIN_EMAIL=<Email for FluxConfig sysadmin account>
FCM_SYSADMIN_USERNAME=<Username for FluxConfig sysadmin account>
FCM_SYSADMIN_PASSWORD=<Password for FluxConfig sysadmin account>

PG_USER=<ADMIN PostgreSQL USERNAME or AUTO GENERATED>
PG_PSWD=<ADMIN PostgreSQL PASSWORD or AUTO GENERATED>
MONGO_USERNAME=<ADMIN MONGO-DB USERNAME or AUTO GENERATED>
MONGO_PASSWORD=<ADMIN MONGO-DB PASSWORD or AUTO GENERATED>